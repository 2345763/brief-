<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neural Automation Requirement Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky brand bar + 9-segment progress; one MCQ per screen on the left, live "requirement brief" spec sheet on the right (bottom sheet on phones). Single dark brand look. */
:root{
  --bg:#060B1C; --bg-raise:#0A1230; --surface:#0D1838; --surface-2:#122047;
  --line:#1A2A57; --line-strong:#2A3F7C;
  --fg:#EAF0FF; --muted:#93A1CB; --faint:#6E7DAA;
  --accent:#2F7CFF; --accent-hi:#64A2FF; --accent-soft:rgba(47,124,255,.16);
  --cyan:#5BDFFF; --error:#FF7088; --ok:#3DDC97; --on-accent:#FFFFFF;
  --glow:rgba(47,124,255,.22); --glow-2:rgba(91,223,255,.08); --scrim:rgba(3,6,16,.66);
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-md:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --chrome:100px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 520px at 88% -12%,var(--glow),transparent 65%),radial-gradient(700px 520px at -12% 112%,var(--glow-2),transparent 60%)}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7}
.app{position:relative;z-index:1;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.q-title:focus,.hero:focus{outline:none}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;width:30px;height:30px}
.mk-bg{fill:var(--surface-2);stroke:var(--line-strong)}
.mk-ln{stroke:var(--accent-hi);fill:none;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.mk-nd{fill:var(--cyan)}
.wordmark{font:500 13px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.wordmark span{color:var(--muted)}
.tb-sep{width:1px;height:18px;background:var(--line-strong)}
.tb-doc{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.counter{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.preview-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:500 13px var(--font-body);cursor:pointer}
.preview-btn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:600 11px var(--font-mono)}
@media (max-width:560px){.tb-sep,.tb-doc{display:none}}
@media (min-width:1024px){.preview-btn{display:none}}
.progress{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding-block:0 10px;transition:opacity .3s}
.is-welcome .progress{opacity:0}
.seg{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));transform-origin:left;transform:scaleX(0);transition:transform .55s var(--ease)}
.seg.done i{transform:scaleX(1)}
.seg.now i{transform:scaleX(.42)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-block:24px 0}
@media (min-width:1024px){
  :root{--chrome:124px}
  .layout{grid-template-columns:minmax(0,1fr) 400px;gap:64px;padding-block-start:48px}
  .is-review .layout{grid-template-columns:minmax(0,1fr)}
}
.stage{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - var(--chrome) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - var(--chrome) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.step{flex:1;display:flex;flex-direction:column;gap:28px;width:100%;max-width:700px}
.step-anim{animation:stepIn .55s var(--ease) both}
.step.leaving{animation:stepOut .17s ease forwards}
@keyframes stepIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes stepOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}

/* Welcome */
.welcome{justify-content:center;gap:26px;padding-bottom:40px}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0;font:500 12px/1.2 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-hi)}
.q-no{padding:4px 7px;border:1px solid var(--line-strong);border-radius:6px;color:var(--fg);letter-spacing:.04em}
.hero{margin:0;font:500 clamp(34px,6.4vw,66px)/1.04 var(--font-display);letter-spacing:-.035em;text-wrap:balance;max-width:13ch}
.hero .w{display:inline-block;animation:stepIn .75s var(--ease) both;animation-delay:calc(var(--i) * 70ms + 60ms)}
.hero .hl{background:linear-gradient(100deg,var(--accent-hi),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;max-width:54ch;font-size:17px;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0;max-width:600px}
.topics li{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font:500 12px var(--font-mono);color:var(--muted);background:var(--bg-raise);animation:stepIn .5s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 380ms)}
.welcome-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;font-size:14px;color:var(--muted)}
.facts b{font:600 13px var(--font-mono);color:var(--fg);margin-right:6px}

/* Question */
.q-head{display:flex;flex-direction:column}
.q-title{margin:14px 0 0;font:600 clamp(26px,3.5vw,38px)/1.16 var(--font-body);letter-spacing:-.025em;text-wrap:balance;max-width:24ch}
.q-help{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:56ch}
.q-body{display:flex;flex-direction:column;gap:16px}

.options{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){
  .options.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .options.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .options.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt.wide{grid-column:1/-1}
}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-width:0;text-align:left;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;transition:border-color .2s,background-color .2s,box-shadow .25s,transform .2s var(--ease);animation:stepIn .5s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 120ms)}
@media (hover:hover){.opt:hover{border-color:var(--line-strong);background:var(--surface-2);transform:translateY(-1px)}}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent),0 14px 34px -20px var(--accent)}
.key{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line-strong);display:grid;place-items:center;font:600 12px var(--font-mono);color:var(--muted);transition:all .2s}
.opt[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt-label{font-weight:600;font-size:16px;line-height:1.3}
.opt-sub{color:var(--muted);font-size:13.5px;line-height:1.4}
.opt-num{flex:none;min-width:2.1ch;font:500 26px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.opt-num.c{color:var(--muted)}
.ind{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--on-accent);transition:all .2s}
.opt[role="checkbox"] .ind{border-radius:6px}
.ind svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:all .22s var(--ease)}
.opt[aria-checked="true"] .ind{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .ind svg{opacity:1;transform:none}
.pf{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:600 13px var(--font-mono);background:var(--bg-raise);border:1px solid var(--line-strong);color:var(--accent-hi);transition:all .2s}
.opt[aria-checked="true"] .pf{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.opt.sm{padding:12px 14px;gap:12px}
.opt.sm .opt-label{font-size:14.5px;font-weight:500}
@media (min-width:640px){
  .opt.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"key . ind" "num num num" "body body body";align-items:center;row-gap:14px;padding:18px}
  .opt.tile .key{grid-area:key}
  .opt.tile .ind{grid-area:ind}
  .opt.tile .opt-num{grid-area:num;font-size:44px}
  .opt.tile .opt-body{grid-area:body}
  .opt.tile .qm{grid-area:num}
  .opt.tile .opt-num.money{font-size:28px}
}
.qm{flex:none;display:flex;gap:4px;align-items:flex-end;height:22px}
.qm i{width:7px;border-radius:2px;background:var(--line-strong);transition:background .2s}
.qm i:nth-child(1){height:30%}.qm i:nth-child(2){height:55%}.qm i:nth-child(3){height:78%}.qm i:nth-child(4){height:100%}
.qm i.on{background:var(--accent-hi)}
.opt[aria-checked="true"] .qm i.on{background:var(--cyan)}

.pick-count{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0;font:500 13px var(--font-mono);color:var(--muted)}
.pick-count b{color:var(--fg);font-weight:600}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line-strong);transition:background .25s}
.dots i.on{background:var(--accent)}

/* Fields */
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:640px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:8px;min-width:0;animation:stepIn .5s var(--ease) both;animation-delay:calc(var(--i) * 50ms + 120ms)}
.field>label{font-size:13.5px;font-weight:500;color:var(--muted)}
.input{width:100%;min-width:0;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-body);transition:border-color .2s,box-shadow .2s,opacity .2s}
.input::placeholder{color:var(--faint);font-weight:400}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{opacity:.45}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.field.invalid .input{border-color:var(--error)}
.err{margin:0;color:var(--error);font-size:13px}
.err:empty{display:none}
.opt-tag{font:500 11px var(--font-mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.check{position:relative;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;padding-block:4px}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--on-accent);transition:all .2s}
.check .box svg{width:12px;height:12px;opacity:0}
.check input:checked+.box{background:var(--accent);border-color:var(--accent)}
.check input:checked+.box svg{opacity:1}
.check input:focus-visible+.box{outline:2px solid var(--accent-hi);outline-offset:2px}
.custom-row{display:flex;flex-direction:column;gap:8px;max-width:320px;animation:stepIn .35s var(--ease) both}
.custom-row label{font-size:13.5px;font-weight:500;color:var(--muted)}

.err-all{margin:0;min-height:20px;color:var(--error);font-size:14px}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* Buttons & nav */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:12px;border:1px solid transparent;font:600 15px var(--font-body);cursor:pointer;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
@media (hover:hover){.btn.primary:hover{background:var(--accent-hi)}.btn.ghost:hover{border-color:var(--muted)}.btn:hover .arr{transform:translateX(3px)}}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn svg{flex:none}
.arr{transition:transform .2s var(--ease)}
.nav{position:sticky;bottom:0;z-index:5;margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:28px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 58%,transparent)}
.nav .spacer{flex:1}
.hint{font:400 12px var(--font-mono);color:var(--faint);white-space:nowrap}
@media (hover:none),(max-width:639px){.hint{display:none}}
@media (max-width:639px){.nav .btn.primary{flex:1}}

/* Live preview */
.preview{display:none}
@media (min-width:1024px){
  .preview{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);align-self:start;max-height:calc(100dvh - 120px);overflow:auto;padding-bottom:28px;scrollbar-width:thin}
  .is-review .preview{display:none}
}
.aside-note{display:flex;align-items:center;gap:8px;margin:0;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:live 2.2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

.brief{background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.brief-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px;background:linear-gradient(135deg,var(--accent-soft),transparent 70%);border-bottom:1px dashed var(--line-strong)}
.bh-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.bh-title{font:500 18px/1.25 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.bh-sub{font-size:13px;color:var(--muted)}
.bh-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:400 11px var(--font-mono);color:var(--muted);text-align:right}
.bsec{display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.bsec:last-child{border-bottom:0}
.bsec.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.sec-head{display:flex;align-items:center;gap:8px;min-height:24px}
.sec-label{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sec-meta{margin-left:auto;font:500 12px var(--font-mono);color:var(--muted)}
.sec-head .edit{margin-left:auto}
.sec-head .sec-meta+.edit{margin-left:4px}
.edit{background:none;border:0;color:var(--accent-hi);font:500 13px var(--font-body);cursor:pointer;padding:4px 8px;border-radius:6px}
@media (hover:hover){.edit:hover{background:var(--accent-soft)}}
.kv{display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--faint);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.5px}
.chip b{font:600 11px var(--font-mono);padding:3px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-hi)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface);min-width:0}
.stat-n{font:500 24px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-l{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{position:relative;height:36px;min-width:0;border-radius:6px;background:var(--surface);border:1px solid var(--line);padding:4px 4px 8px;display:flex;align-items:flex-end}
.dn{position:absolute;top:3px;left:5px;font:400 9px/1 var(--font-mono);color:var(--faint)}
.marks{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.mp{display:block;width:6px;height:6px;border-radius:1.5px;background:var(--accent)}
.mr{display:block;width:0;height:0;border-left:6px solid var(--cyan);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.ms{display:block;width:12px;height:2px;border-radius:2px;background:var(--accent-hi)}
.day.s1::after,.day.s2::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:2px;border-radius:2px;background:var(--accent-hi);opacity:.6}
.day.s2::after{box-shadow:0 -3px 0 var(--accent-hi)}
.flash .marks>*{animation:pop .4s var(--ease) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.cal-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.cal-total{margin-left:auto;font:500 12px var(--font-mono);color:var(--fg)}
.xlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.xlist li::marker{font-family:var(--font-mono);color:var(--accent-hi);font-size:12px}
.meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.meter i{height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
.qv{display:flex;flex-direction:column;gap:2px;font-size:14px}
.qv strong{font:500 16px var(--font-display);letter-spacing:-.01em}
.qv span{color:var(--muted);font-size:13px}
.bv{font:500 20px var(--font-display);letter-spacing:-.02em}

/* Review */
.review{max-width:760px;margin:0 auto;gap:24px}
.brief-review .bsec{padding:18px 24px}
.brief-review .brief-head{padding:22px 24px}
.brief-review .bh-title{font-size:22px}
@media (min-width:640px){.brief-review .day{height:42px}}
.send{display:flex;flex-wrap:wrap;gap:12px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end}

.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--fg);font:500 14px var(--font-body);white-space:nowrap;transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){

          cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
        }
      }
    }
    cx.fillStyle = 'rgba(120,182,255,' + (.42 + pulse * .4).toFixed(3) + ')';
    for (i = 0; i < nodes.length; i++) {
      a = nodes[i]; cx.beginPath(); cx.arc(a.x, a.y, a.r * (1 + pulse * .5), 0, 6.2832); cx.fill();
    }
  }
  function loop() {
    pulse *= .955; if (pulse < .01) pulse = 0;
    draw(true);
    raf = requestAnimationFrame(loop);
  }
  if (cx) {
    seed();
    if (reduce) draw(false); else raf = requestAnimationFrame(loop);
    window.addEventListener('resize', function () {
      clearTimeout(rsT);
      rsT = setTimeout(function () { seed(); if (reduce) draw(false); }, 200);
    });
    document.addEventListener('visibilitychange', function () {
      if (reduce) return;
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) raf = requestAnimationFrame(loop);
    });
  }

  /* ---------- boot ---------- */
  go(0, true);
})();
</script>
